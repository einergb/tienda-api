services:
  db:
    image: postgres:16-alpine
    container_name: tienda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tienda}
      POSTGRES_USER: ${DB_USER:-tienda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tienda-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-tienda}
      DB_USER: ${DB_USER:-tienda}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (minimo 32 caracteres) en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tienda.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TIENDA_NOMBRE: ${TIENDA_NOMBRE:-TechStore}
    ports:
      - "8080:8080"

volumes:
  db_data:
