services:
  api:
    build: .
    container_name: tienda-api
    restart: unless-stopped
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_URL: jdbc:postgresql://web_db:5432/${DB_NAME:-tienda}
      DB_USER: ${DB_USER:-tienda}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (minimo 32 caracteres) en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tienda.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TIENDA_NOMBRE: ${TIENDA_NOMBRE:-TechStore}
    ports:
      - "192.168.0.150:8080:8080"
    networks:
      - default
      - homelab_net
networks:
  homelab_net:
    external: true