server:
  port: 8080

spring:
  application:
    name: tienda-api
  cache:
    type: ${CACHE_TYPE:none}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fallar rápido cuando Redis no responde: la caché cae a BD en vez de esperar.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tienda}
    username: ${DB_USER:tienda}
    password: ${DB_PASSWORD:tienda}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

# Valores configurables de la tienda
tienda:
  nombre: ${TIENDA_NOMBRE:TechStore}
  moneda: COP
  iva: 0.19
  envio-gratis-desde: 200000
  costo-envio-base: 10000
  stock-minimo-alerta: 5
  reserva-stock-minutos: 15
  jwt:
    # Sin secreto (o con uno corto) la app no arranca: ver ValidacionConfiguracion.
    secret: ${JWT_SECRET:}
    expiracion-minutos: 120
  admin:
    email: ${ADMIN_EMAIL:admin@tienda.local}
    password: ${ADMIN_PASSWORD:}
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:5173}
  rate-limit:
    peticiones-por-minuto: ${RATE_LIMIT_MAXIMO:300}
    peticiones-auth-por-minuto: ${RATE_LIMIT_AUTH_MAXIMO:10}
    ventana-segundos: 60
  pagos:
    # simulado: no llama APIs externas. real: usa wompi/epayco contra sus sandboxes.
    modo: ${PAGOS_MODO:simulado}
    wompi:
      api-url: ${WOMPI_API_URL:https://api.sandbox.wompi.co/v1}
      public-key: ${WOMPI_PUBLIC_KEY:}
      private-key: ${WOMPI_PRIVATE_KEY:}
      # SHA-256(payload + integrity-secret) = cabecera X-Event-Checksum de los webhooks
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      redirect-url: ${WOMPI_REDIRECT_URL:}
    epayco:
      api-url: ${EPAYCO_API_URL:https://api.secure.epayco.co}
      apify-url: ${EPAYCO_APIIFY_URL:https://apify.epayco.co}
      public-key: ${EPAYCO_PUBLIC_KEY:}
      private-key: ${EPAYCO_PRIVATE_KEY:}
  captcha:
    secreto: ${CAPTCHA_SECRETO:}
    url: ${CAPTCHA_URL:https://www.google.com/recaptcha/api/siteverify}
  mail:
    from: ${MAIL_FROM:no-reply@tienda.local}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://192.168.0.150:9000}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:tienda-productos-dev}
    public-base-url: ${STORAGE_PUBLIC_URL:http://192.168.0.150:9000}
    public-url-incluye-bucket: ${STORAGE_PUBLIC_URL_INCLUYE_BUCKET:true}
  cache:
    ttl-productos: ${CACHE_TTL_PRODUCTOS:60s}
    ttl-listados: ${CACHE_TTL_LISTADOS:30s}
    ttl-categorias: ${CACHE_TTL_CATEGORIAS:1h}
    ttl-tienda: ${CACHE_TTL_TIENDA:1h}

